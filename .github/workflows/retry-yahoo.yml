name: Delayed Yahoo Retry

on:
  workflow_run:
    workflows: [Daily Yahoo Finance Bubble Update]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Retry failed scheduled update after one hour
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-24.04
    environment:
      name: delayed-yahoo-retry
      deployment: false
    steps:
      - name: Dispatch one retry of the Yahoo pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_REF: ${{ github.event.workflow_run.head_branch }}
        run: gh workflow run main.yml --ref "$RETRY_REF"
