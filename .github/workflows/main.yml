name: Daily Yahoo Finance Bubble Update

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: production-yahoo-bubble-update
  cancel-in-progress: false

jobs:
  update-csvs:
    name: Scrape, Validate & Publish CSVs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci

      - name: Run strict CSV scraper
        run: python scripts/yf_data_scraper.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_BASE_URL: ${{ secrets.BLOB_BASE_URL }}

      - name: Upload pipeline status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-status
          path: data/pipeline-status.json
          if-no-files-found: warn

      - name: Upload validated staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-staging
          path: |
            data/csv/*.csv
            data/prices/*.csv
          if-no-files-found: error

  generate-mat-json:
    name: Generate, Validate & Publish JSON
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: update-csvs
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci

      - name: Download validated staging artifacts
        uses: actions/download-artifact@v4
        with:
          name: yahoo-staging
          path: data

      - name: Validate all staged tickers
        run: python scripts/validate_pipeline_staging.py

      - name: Generate MAT files
        run: python scripts/sbub_run.py

      - name: Convert MAT files into offline JSON
        run: python scripts/bubble_estimator.py

      - name: Validate generated Yahoo JSON
        run: npm run validate-yahoo-pipeline -- --json

      - name: Upload JSON files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bubble-json-files
          path: public/data/*.json
          if-no-files-found: error

      - name: Upload JSONs to Vercel Blob and update mapping
        id: upload_blob
        run: npm exec tsx scripts/update-blob-urls.ts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_BASE_URL: ${{ secrets.BLOB_BASE_URL }}

      - name: Validate live Yahoo Blob mapping
        run: npm run validate-yahoo-pipeline -- --blob
        env:
          BLOB_BASE_URL: ${{ secrets.BLOB_BASE_URL }}

      - name: Trigger Vercel redeploy
        if: steps.upload_blob.outputs.blob_changed == 'true'
        run: curl --fail --show-error --silent -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      - name: Write deployment summary
        if: always()
        run: |
          echo "## Yahoo pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- CSV staging: validated all 25 required tickers" >> "$GITHUB_STEP_SUMMARY"
          echo "- JSON upload count: ${{ steps.upload_blob.outputs.json_upload_count || 'not published' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Blob mapping changed: ${{ steps.upload_blob.outputs.blob_changed || 'not published' }}" >> "$GITHUB_STEP_SUMMARY"
